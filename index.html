<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQI Meter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080d;--panel:#0b1119;--line:#1b2a3a;--tx:#d4f1ff;--dim:#6f8aa0;--grid:#0c1722;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3f7;--panel:#fff;--line:#c9d6e0;--tx:#10222f;--dim:#55697a;--grid:#e1e9ef;color-scheme:light}}
:root[data-theme="light]{--bg:#eef3f7;--panel:#fff;--line:#c9d6e0;--tx:#10222f;--dim:#55697a;--grid:#e1e9ef;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100%}
main{max-width:520px;margin:0 auto;padding:14px 14px 28px}
h1{font:800 18px Orbitron,system-ui,sans-serif;letter-spacing:.14em;margin:6px 0 12px;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
button.on{border-color:var(--c,#0ff);color:var(--c,#0ff);box-shadow:0 0 8px -2px var(--c,#0ff)}
.lbl{color:var(--dim);font-size:12px;margin:0 0 6px;letter-spacing:.08em;text-transform:uppercase}
#gauge{width:100%;display:block}
.read{text-align:center;margin-top:-6px}
#num{font:800 54px/1 Orbitron,system-ui,sans-serif;transition:color .3s,text-shadow .3s}
#cat{font:500 18px Orbitron,system-ui,sans-serif;letter-spacing:.1em;margin-top:4px}
#adv{color:var(--dim);margin-top:6px;min-height:42px}
#dom{margin-top:2px;font-size:13px}
.row{padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hd b{font-weight:400;min-width:64px}
.hd .val{flex:1;text-align:right;color:var(--dim)}
.hd .si{min-width:62px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--c);border:2px solid var(--bg);box-shadow:0 0 10px var(--c)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--bg);box-shadow:0 0 10px var(--c)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .25s,background .25s}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--dim)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
html,body{height:100%;overflow:hidden}
body{font-size:13px;line-height:1.25;background-size:20px 20px}
main{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:520px;display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:15px;text-align:left}
button{padding:5px 8px;font-size:12px}
.seg{flex-wrap:nowrap;gap:5px}
#pre button{flex:1;padding:5px 2px}
.panel{padding:6px 10px 8px;margin:0;flex:0 0 auto}
#gauge{height:26dvh;max-height:210px;width:100%}
.read{display:grid;grid-template-columns:auto 1fr;column-gap:14px;text-align:left;align-items:center;margin-top:-4px}
#num{grid-row:1/4;font-size:44px;min-width:92px;text-align:center}
#cat{font-size:14px;margin:0}
#adv{font-size:11px;min-height:0;margin:2px 0}
#dom{font-size:11px;margin:0}
#rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around}
.row{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:8px;padding:0;border:0}
.nm b{display:block;font-size:13px}
.nm .val{display:block;font-size:11px;color:var(--dim)}
.si{text-align:right;font:800 15px Orbitron,system-ui,sans-serif}
input[type=range]{height:30px;margin:0}
</style>
</head>
<body>
<main>
<div class="top"><h1>AQI METER</h1><div class="seg" id="stds"></div></div>
<div class="seg" id="pre"></div>
<div class="panel">
  <svg id="gauge" viewBox="0 0 360 215" aria-label="AQI gauge"></svg>
  <div class="read">
    <div id="num">0</div>
    <div id="cat"></div>
    <div id="adv"></div>
    <div id="dom"></div>
  </div>
</div>
<div id="rows"></div>
</main>
<script>
(function(){
"use strict";
// b = concentration upper bounds for each zone; idx = AQI upper bounds
var STD={
 cpcb:{name:"India (CPCB)",idx:[50,100,200,300,400,500],
  cats:[["Good","#00e676","Minimal impact. Enjoy the outdoors."],
        ["Satisfactory","#9be32f","Minor breathing discomfort for sensitive people."],
        ["Moderate","#ffd600","Breathing discomfort for people with lung or heart disease."],
        ["Poor","#ff9100","Discomfort on prolonged exposure. Limit outdoor exertion."],
        ["Very Poor","#ff3d3d","Respiratory illness on prolonged exposure. Stay indoors."],
        ["Severe","#c2185b","Affects healthy people too. Avoid all outdoor activity."]],
  poll:{pm25:{n:"PM2.5",u:"µg/m³",d:1,b:[30,60,90,120,250,380]},
        pm10:{n:"PM10",u:"µg/m³",d:0,b:[50,100,250,350,430,510]},
        no2:{n:"NO₂ (NOx)",u:"µg/m³",d:0,b:[40,80,180,280,400,520]},
        so2:{n:"SO₂",u:"µg/m³",d:0,b:[40,80,380,800,1600,2100]},
        o3:{n:"Ozone O₃",u:"µg/m³",d:0,b:[50,100,168,208,748,1000]},
        co:{n:"CO",u:"mg/m³",d:1,b:[1,2,10,17,34,50]},
        nh3:{n:"NH₃",u:"µg/m³",d:0,b:[200,400,800,1200,1800,2400]}}},
 epa:{name:"US EPA",idx:[50,100,150,200,300,500],
  cats:[["Good","#00e676","Air quality is satisfactory."],
        ["Moderate","#ffd600","Unusually sensitive people should limit prolonged exertion."],
        ["Unhealthy for Sensitive","#ff9100","Children, elders and people with lung disease should cut back outdoors."],
        ["Unhealthy","#ff3d3d","Everyone may begin to feel effects. Reduce outdoor exertion."],
        ["Very Unhealthy","#b44cff","Health alert. Everyone should avoid outdoor exertion."],
        ["Hazardous","#a3123a","Emergency conditions. Stay indoors."]],
  poll:{pm25:{n:"PM2.5",u:"µg/m³",d:1,b:[9,35.4,55.4,125.4,225.4,325.4]},
        pm10:{n:"PM10",u:"µg/m³",d:0,b:[54,154,254,354,424,604]},
        no2:{n:"NO₂ (NOx)",u:"ppb",d:0,b:[53,100,360,649,1249,2049]},
        so2:{n:"SO₂",u:"ppb",d:0,b:[35,75,185,304,604,1004]},
        o3:{n:"Ozone O₃",u:"ppb",d:0,b:[54,70,85,105,200,300]},
        co:{n:"CO",u:"ppm",d:1,b:[4.4,9.4,12.4,15.4,30.4,50.4]}}}
};
// presets expressed as sub-index per pollutant, independent of standard
var PRE=[
 ["Clean",{pm25:18,pm10:15,no2:12,so2:8,o3:30,co:10,nh3:8}],
 ["City",{pm25:150,pm10:120,no2:90,so2:40,o3:70,co:60,nh3:30}],
 ["Festival",{pm25:420,pm10:370,no2:180,so2:210,o3:80,co:220,nh3:70}],
 ["Smog",{pm25:290,pm10:250,no2:310,so2:360,o3:130,co:200,nh3:150}]
];
var cur="cpcb",S=STD[cur],T={pm25:90,pm10:130,no2:200,so2:130,o3:200,co:120,nh3:100};
var needle=0,vel=0,target=0;
var $=function(id){return document.getElementById(id)};
function maxC(p){return p.b[p.b.length-1]}
function conc(p,t){return maxC(p)*Math.pow(t/1000,2)}
function posOf(p,c){return 1000*Math.sqrt(Math.max(0,Math.min(1,c/maxC(p))))}
function sub(p,c){var b=p.b,I=S.idx,i=b.findIndex(function(x){return c<=x});if(i<0)i=b.length-1;
 var lc=i?b[i-1]:0,li=i?I[i-1]:0;return li+Math.min(1,(c-lc)/(b[i]-lc))*(I[i]-li)}
function inv(p,v){var I=S.idx,i=I.findIndex(function(x){return v<=x});if(i<0)i=I.length-1;
 var li=i?I[i-1]:0,lc=i?p.b[i-1]:0;return lc+(v-li)/(I[i]-li)*(p.b[i]-lc)}
function ci(v){var i=S.idx.findIndex(function(x){return v<=x});return i<0?5:i}
function pt(v,r){var a=Math.PI*(1-v/500);return[180+r*Math.cos(a),180-r*Math.sin(a)]}
function arc(v1,v2,r){var a=pt(v1,r),b=pt(v2,r);return"M"+a[0].toFixed(1)+" "+a[1].toFixed(1)+"A"+r+" "+r+" 0 0 1 "+b[0].toFixed(1)+" "+b[1].toFixed(1)}
function buildGauge(){
 var g="",bd=[0].concat(S.idx),i,p;
 g+='<path d="'+arc(0,500,140)+'" stroke="var(--line)" stroke-width="26" fill="none" opacity=".5"/>';
 for(i=0;i<6;i++){g+='<path d="'+arc(bd[i]+1.5,bd[i+1]-1.5,140)+'" stroke="'+S.cats[i][1]+'" stroke-width="22" fill="none" style="filter:drop-shadow(0 0 4px '+S.cats[i][1]+')"/>';}
 for(i=0;i<=6;i++){p=pt(bd[i],164);g+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3).toFixed(1)+'" text-anchor="middle" font-size="10" fill="var(--dim)" font-family="Share Tech Mono,monospace">'+bd[i]+'</text>';}
 for(i=0;i<=50;i++){var a=pt(i*10,122),b=pt(i*10,i%5?118:112);g+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="var(--dim)" stroke-width="'+(i%5?1:1.6)+'" opacity=".6"/>';}
 g+='<g id="nd"><polygon points="60,180 183,175 183,185" id="ndp" fill="#fff"/></g>';
 g+='<circle cx="180" cy="180" r="11" id="hub" fill="var(--bg)" stroke="#fff" stroke-width="3"/>';
 $("gauge").innerHTML=g;
}
function buildRows(){
 var h="";
 Object.keys(S.poll).forEach(function(k){h+='<div class="row" id="r_'+k+'"><div class="nm"><b>'+S.poll[k].n+'</b><span class="val"></span></div><input type="range" min="0" max="1000" step="1" data-k="'+k+'" value="'+T[k]+'" aria-label="'+S.poll[k].n+'"><span class="si"></span></div>';});
 $("rows").innerHTML=h;
 $("rows").querySelectorAll("input").forEach(function(el){el.addEventListener("input",function(){T[el.dataset.k]=+el.value;update()});});
}
function update(){
 var best=-1,dom="",aqi=0;
 Object.keys(S.poll).forEach(function(k){
  var p=S.poll[k],c=conc(p,T[k]),s=sub(p,c),col=S.cats[ci(s)][1],r=$("r_"+k);
  r.querySelector(".val").textContent=c.toFixed(p.d)+" "+p.u;
  var si=r.querySelector(".si");si.textContent=Math.round(s);si.style.color=col;
  r.querySelector("input").style.setProperty("--c",col);
  if(s>best){best=s;dom=p.n}
 });
 aqi=Math.round(best);target=best;
 var c=S.cats[ci(best)];
 $("num").textContent=aqi;$("num").style.color=c[1];$("num").style.textShadow="0 0 18px "+c[1];
 $("cat").textContent=c[0].toUpperCase();$("cat").style.color=c[1];
 $("adv").textContent=c[2];
 $("dom").innerHTML='Dominant pollutant: <span style="color:'+c[1]+'">'+dom+"</span>";
 $("ndp").setAttribute("fill",c[1]);$("hub").setAttribute("stroke",c[1]);
 $("nd").style.filter="drop-shadow(0 0 5px "+c[1]+")";
}
function tick(){
 var acc=(target-needle)*55-vel*7;
 vel+=acc/60;needle+=vel/60;
 $("nd").setAttribute("transform","rotate("+(180*Math.max(0,Math.min(500,needle))/500).toFixed(2)+" 180 180)");
 requestAnimationFrame(tick);
}
function mkSeg(id,items,on){
 $(id).innerHTML="";
 items.forEach(function(it,i){var b=document.createElement("button");b.textContent=it[0];if(it[2])b.style.setProperty("--c",it[2]);if(on&&on(i))b.classList.add("on");b.addEventListener("click",function(){it[1]()});$(id).appendChild(b);});
}
function setStd(k){
 cur=k;S=STD[k];
 mkSeg("stds",Object.keys(STD).map(function(x){return[STD[x].name,function(){setStd(x)},"#00e5ff"]}),function(i){return Object.keys(STD)[i]===cur});
 buildGauge();buildRows();update();
}
function preset(v){
 Object.keys(S.poll).forEach(function(k){T[k]=posOf(S.poll[k],inv(S.poll[k],v[k]))});
 buildRows();update();
}
mkSeg("pre",PRE.map(function(p){return[p[0],function(){preset(p[1])},"#ff9100"]}));
setStd("cpcb");
needle=0;requestAnimationFrame(tick);
})();
</script>
</body>
</html>
